name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every run is a fresh checkout, so the clean-build requirement that used to be
# enforced by hand at release time is now satisfied automatically on every pull
# request — including ones from outside contributors.
jobs:
  test:
    name: Tests and iOS build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      # Runs on macOS, which compiles none of the #if os(iOS) view code.
      - name: Unit tests
        run: swift test

      # The pass that actually compiles the SwiftUI views. A broken preview
      # fixture once shipped because only the macOS test run was gating it.
      #
      # xcodebuild, not `swift build -Xswiftc -sdk`: that flag does not reliably
      # reach the compiler across build systems. On 6.3.3 it silently fell back
      # to the macOS sysroot and failed on `cannot load underlying module for
      # UIKit`, while passing on 6.4 locally. xcodebuild is also how a host app
      # actually builds this package, and it compiles the String Catalog on the
      # way through, which a plain `swift build` on the native engine does not.
      - name: iOS simulator build
        run: |
          xcodebuild build \
            -scheme FeedbackThread \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/dd \
            -skipMacroValidation
